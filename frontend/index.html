<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripMate Smart Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#10212b',
            coral: '#ff7a59',
            sand: '#fff7ef',
            teal: '#0d9488',
            mist: '#dbeafe'
          },
          fontFamily: {
            display: ['Space Grotesk', 'sans-serif'],
            body: ['Manrope', 'sans-serif']
          },
          boxShadow: {
            glow: '0 20px 50px rgba(16, 33, 43, 0.12)'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="bg-sand text-ink font-body">
  <div id="root"></div>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" src="./app.jsx"></script>
</body>
</html>
